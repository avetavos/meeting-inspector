appId: dev.avetavos.meeting-inspector
productName: Meeting Inspector
directories:
  output: release
  buildResources: build

afterPack: build/after-pack.cjs

files:
  - out/**
  - package.json

# sherpa-onnx ships a .node addon plus three dylibs; dlopen cannot read them
# from inside an asar archive.
asarUnpack:
  - '**/node_modules/sherpa-onnx-*/**'

# Statically built by build/build-whisper.mjs so the .dmg does not need Homebrew.
extraResources:
  - from: resources/whisper
    to: whisper
  # The Chrome extension that syncs the meeting's mute button with this app's own
  # microphone. Shipped inside the .app so someone who installed the .dmg has it to
  # hand — Settings › Connections reveals this folder for "Load unpacked".
  - from: extension
    to: extension

mac:
  category: public.app-category.productivity
  # Unsigned by design (spec §3) — the first launch needs Open Anyway.
  identity: null
  target:
    - target: dmg
      arch: [arm64]
  extendInfo:
    # Without this the mic prompt kills the app instead of asking.
    NSMicrophoneUsageDescription: อัดเสียงของคุณเป็น track แยกระหว่างประชุม

dmg:
  title: Meeting Inspector
