<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; script-src 'self' blob:" />
    <title>Meeting Inspector</title>
    <style>
      :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 15%, transparent); }
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 28px; }
      h1 { font-size: 17px; margin: 0 0 20px; }
      input, button { font: inherit; }
      input { padding: 8px 10px; width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
      button { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
      button:disabled { opacity: .4; cursor: default; }
      .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
      .meter { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
      .meter > i { display: block; height: 100%; width: 0; background: currentColor; transition: width 80ms linear; }
      .label { width: 88px; opacity: .7; font-size: 13px; }
      .warn { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
      .warn button { padding: 4px 10px; font-size: 13px; margin-top: 8px; }
      .hint { font-size: 13px; opacity: .7; }
      #elapsed { font-variant-numeric: tabular-nums; opacity: .7; }
      #done { margin-top: 16px; font-size: 14px; }
      #queue { margin-top: 12px; font-size: 13px; opacity: .8; }

      #models { margin-bottom: 20px; }
      #models .warn { margin-top: 0; }
      #models .file { display: grid; grid-template-columns: 1fr 88px; gap: 8px 12px; align-items: center; margin-top: 10px; font-size: 13px; }
      #models .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
      #models .bar > i { display: block; height: 100%; width: 0; background: currentColor; }
      #models .size { text-align: right; opacity: .6; font-variant-numeric: tabular-nums; }

      #speakers { margin-top: 16px; }
      #speakers .who { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
      #speakers .who code { font-size: 12px; opacity: .5; width: 90px; }
      #speakers input { flex: 1; }
      #speakers .hint { margin-top: 10px; }

      #transcript { margin-top: 16px; max-height: 40vh; overflow-y: auto; border-top: 1px solid var(--line); }
      #transcript p { margin: 12px 0 0; display: grid; grid-template-columns: 52px 64px 1fr; gap: 10px; }
      #transcript .t { opacity: .45; font-variant-numeric: tabular-nums; font-size: 13px; }
      #transcript .who { opacity: .7; font-size: 13px; }
      #transcript .me .who { opacity: 1; font-weight: 600; }

      details { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 14px; }
      details summary { cursor: pointer; opacity: .7; }
      details label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
      #mcpstate { font-size: 13px; opacity: .7; margin-top: 8px; }
      #mcpstate code { user-select: all; word-break: break-all; }
      .copyrow { margin-top: 6px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
      .copyrow button { padding: 2px 8px; font-size: 12px; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>Meeting Inspector</h1>
    <div id="models"></div>
    <input id="title" placeholder="ชื่อการประชุม" autocomplete="off" />
    <div class="row">
      <button id="toggle">เริ่มอัด</button>
      <span id="elapsed"></span>
    </div>
    <div class="row"><span class="label">คนอื่น</span><span class="meter"><i id="m-loopback"></i></span></div>
    <div class="row"><span class="label">เรา</span><span class="meter"><i id="m-mic"></i></span></div>
    <div id="warnings"></div>
    <div id="queue"></div>
    <div id="done"></div>
    <div id="speakers"></div>
    <div id="transcript"></div>
    <details>
      <summary>ตั้งค่า</summary>
      <div class="row">
        <label><input type="checkbox" id="mcp" /> เปิด MCP server ให้ AI ในเครื่องดึง transcript ไปสรุป</label>
      </div>
      <div id="mcpstate"></div>
    </details>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
