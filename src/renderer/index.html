<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; script-src 'self' blob:" />
    <title>Meeting Inspector</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <div class="titlebar"></div>
      <main id="content" class="content">
        <h1 class="app-title">Meeting Inspector</h1>
        <div id="capsule" class="capsule">
          <div class="capsule-top">
            <input id="title" placeholder="Meeting title" autocomplete="off" />
            <button id="toggle">Start recording</button>
            <span id="elapsed"></span>
          </div>
          <div class="meters">
            <div class="meter-channel"><span class="label" id="meter-others-label">Others</span><span class="meter"><i id="m-loopback"></i></span></div>
            <div class="meter-channel"><span class="label" id="meter-us-label">You</span><span class="meter"><i id="m-mic"></i></span></div>
          </div>
        </div>

        <div class="content-inner">
          <div id="models"></div>
          <div id="warnings"></div>
          <div id="queue"></div>
          <div id="done"></div>
          <div id="speakers"></div>
          <div id="transcript"></div>
          <details>
            <summary id="settings-summary">Settings</summary>
            <div class="row">
              <label><input type="radio" name="lang" id="lang-en" /> English</label>
              <label><input type="radio" name="lang" id="lang-th" /> ไทย</label>
            </div>
            <div class="row">
              <label><input type="checkbox" id="mcp" /> <span id="mcp-label">Turn on the MCP server so a local AI assistant can pull the transcript to summarize it</span></label>
            </div>
            <div class="row">
              <span class="label" id="port-label"></span>
              <input id="port" type="number" min="1024" max="65535" />
              <button id="port-save"></button>
            </div>
            <div id="mcpstate"></div>
            <div class="row" style="margin-top:20px">
              <span class="label" id="noise-label"></span>
              <select id="noise">
                <option value="low"></option>
                <option value="medium"></option>
                <option value="high"></option>
              </select>
            </div>
            <div id="noisehint" class="hint"></div>
            <div id="mictest">
              <div class="row">
                <button id="mictest-toggle"></button>
                <span class="meter"><i id="mictest-level"></i></span>
                <span id="mictest-verdict"></span>
              </div>
              <div id="mictest-line"></div>
              <div id="mictest-heard" class="hint"></div>
            </div>
            <div id="voices"></div>
          </details>
        </div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
